<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>dp.AI City Run</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=sf-road-ramps-2026-07-20-27" />
  </head>
  <body>
    <main class="game-shell" aria-label="dp.AI City Run game">
      <canvas
        id="game"
        width="1280"
        height="720"
        aria-label="Side-scrolling platform game canvas"
      ></canvas>
      <label class="test-level-selector" data-test-level-selector hidden>
        <span>Test level</span>
        <select data-test-level-select aria-label="Select a level for testing">
          <option value="1">Level I · Los Angeles</option>
          <option value="2">Level II · San Francisco</option>
        </select>
      </label>
      <button class="reset-btn" type="button" data-control="reset" aria-label="Reset game">⟲ Reset</button>
      <div class="mobile-controls" aria-label="Touch controls">
        <div class="virtual-joystick" data-joystick role="group" aria-label="Movement joystick">
          <div class="virtual-joystick__base">
            <div class="virtual-joystick__knob"></div>
          </div>
        </div>
        <div class="mobile-actions" aria-label="Actions">
          <button class="touch-btn touch-btn--start" type="button" data-control="start" aria-label="Start or confirm">Start</button>
          <button class="touch-btn touch-btn--kick" type="button" data-control="kick" aria-label="Kick">Kick</button>
          <button class="touch-btn touch-btn--jump" type="button" data-control="jump" aria-label="Jump">Jump</button>
        </div>
      </div>
    </main>
    <script src="script.js?v=sf-road-ramps-2026-07-20-27"></script>
  </body>
</html>
